name: CI

on:
  # `agent-isolation` is listed deliberately and should not be tidied away: it is the branch this
  # project is actually developed on, and with `main` alone a push there ran NOTHING unless a pull
  # request happened to be open at that moment. On 2026-08-16 two commits sat pushed and entirely
  # untested because the previous PR had just been merged.
  #
  # That failure mode is worse than it sounds. A branch with no run for its commit does not look
  # red — it looks like whatever the most recent unrelated run was, so a check that asks "what is
  # the latest run on this branch" reports somebody else's success. Silence read as green.
  push:
    branches: ["main", "agent-isolation"]
  pull_request:
  workflow_dispatch: {}

# One run per event per ref, newest wins. Pushing three times in a minute should not queue three
# full matrix builds. `event_name` is in the key on purpose: without it a push would cancel the pull
# request run for the same branch, and the PR run is the one that gates the merge.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The DuckDB sink tests read their destination back with the `duckdb` CLI - a separate binary
      # and a separately built DuckDB - because a writer checked with its own reader agrees with
      # itself about any shared misreading. Where no CLI is found they fall back to the Go driver
      # that did the writing, which is strictly weaker.
      #
      # This says the fallback is NOT acceptable here. Without it, a run whose CLI install stopped
      # working reports exactly the same green as a run that compared against the CLI, and the
      # comparison would go back to running nowhere but a developer's laptop - which is the state
      # this variable exists to end, and which no test failure would have revealed.
      FERRODB_REQUIRE_DUCKDB_CLI: "1"
      # THE DISABLED-TEST GATE — two lints, promoted to errors.
      #
      # On 2026-08-17 a `#[test]` in src/tel/guard.rs was found attached to the wrong function. E60
      # had inserted two new tests between an existing test's attribute and its body, so the
      # attribute landed on a new test that already had one and the original became an ordinary
      # private fn. It had not run since. `cargo test` said nothing, because rustc reports both
      # halves as WARNINGS: `duplicate_macro_attributes` on the doubled attribute and `dead_code` on
      # the orphaned function.
      #
      # The test COUNT cannot catch this and it is worth saying why, because counting is the obvious
      # instrument and it is useless here: a doubled `#[test]` registers the same test twice, so the
      # suite reported one extra run to replace the one it lost. Measured on the replanted defect -
      # 840 attributes, 840 registered, and a test silently not running. E60's ledger row records
      # 823 -> 825 for a pass that added two tests and disabled one; the number went UP.
      #
      # So the guard is the lint, not the count. These two are narrow and long-stable, deliberately
      # NOT `-D warnings`: the toolchain here floats on `stable`, and a blanket deny turns any new
      # lint in a future release into a red build on an unrelated pull request, which is how a guard
      # gets switched off. Measured before turning it on: zero rustc warnings across all three
      # runners on run 32006658708.
      #
      # The cost is real and accepted: a helper used under only one `#[cfg]` now fails the build on
      # the other platforms rather than warning. That is a legible failure with a clear fix, and it
      # is the same shape as the defect being prevented.
      RUSTFLAGS: "-D duplicate_macro_attributes -D dead_code"
      # Pinned, not "latest": an unpinned CLI upgrade that changed a rendering would turn
      # `both_readers_agree` red on an unrelated pull request, and this is also the version the
      # rendering expectations in sink_duckdb_test.go were measured against.
      DUCKDB_VERSION: v1.5.5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The CDC tests drive an independent consumer written in Go and verify its output with the
      # sqlite3 CLI. That independence is the point - an encoder checked with its own decoder
      # agrees with itself about any shared misreading - so the toolchain is a real requirement
      # rather than a convenience, and the tests fail loudly when it is missing instead of skipping.
      # A test that silently skips is a test that always passes.
      #
      # 1.25 because cdc-consumer/go.mod declares `go 1.25.0`. Pinned at 1.24 this step still
      # worked, but only because GOTOOLCHAIN defaults to auto and silently downloaded 1.25 later -
      # which moves a toolchain fetch out of this step and into a build step, exactly what the
      # explicit `go mod download` below exists to prevent.
      #
      # cgo is required and not optional: the DuckDB sink links DuckDB statically, so CGO_ENABLED=0
      # fails to build the consumer module at all, SQLite sink included.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cdc-consumer/go.sum

      # Pre-fetch the sink's one dependency, so a network blip shows up as its own failed step
      # rather than as a mysterious test failure.
      - name: Fetch Go dependencies
        working-directory: cdc-consumer
        run: go mod download

      # sqlite3 ships on the ubuntu and macos runners; Windows needs it installed.
      - name: Install sqlite3 (Windows)
        if: runner.os == 'Windows'
        run: choco install sqlite --no-progress -y

      # The duckdb CLI ships with no runner image, so it is fetched. Two steps rather than one
      # because the extraction tool differs: `unzip` is on the ubuntu and macos images but is NOT in
      # Git-for-Windows bash, which is what `shell: bash` gets on the Windows runner. (pwsh is in
      # fact present on all three images, so a single pwsh step would work; these stay split so each
      # platform uses its own native tooling and neither path is exercised only by the other's CI.)
      - name: Install the duckdb CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # An ALLOWLIST of (os, arch) pairs, not a default. A pair nobody has thought about must
          # stop the run, because the alternative is downloading an asset for the wrong machine or
          # falling through to no CLI at all - and the whole point of the variable set above is
          # that "no CLI" can no longer pass quietly.
          case "${RUNNER_OS}/${RUNNER_ARCH}" in
            Linux/X64)   asset=duckdb_cli-linux-amd64.zip ;;
            Linux/ARM64) asset=duckdb_cli-linux-arm64.zip ;;
            macOS/X64|macOS/ARM64) asset=duckdb_cli-osx-universal.zip ;;
            *)
              echo "No duckdb CLI asset is known for ${RUNNER_OS}/${RUNNER_ARCH}." >&2
              echo "Add the pair here rather than letting the sink tests fall back silently." >&2
              exit 1 ;;
          esac
          dest="$HOME/duckdb-cli"
          mkdir -p "$dest"
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/${asset}"
          unzip -o -q /tmp/duckdb.zip -d "$dest"
          rm -f /tmp/duckdb.zip
          # Name the failure here rather than three steps later as "duckdb: command not found",
          # which reads like a PATH problem and is not one.
          test -f "$dest/duckdb" || {
            echo "$asset extracted but produced no duckdb binary in $dest" >&2
            exit 1
          }
          chmod +x "$dest/duckdb"
          echo "$dest" >> "$GITHUB_PATH"

      - name: Install the duckdb CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Invoke-WebRequest spends most of a large download rendering a progress bar it cannot
          # show on a runner; silencing it is the difference between seconds and minutes.
          $ProgressPreference = 'SilentlyContinue'
          $asset = switch ($env:RUNNER_ARCH) {
            'X64'   { 'duckdb_cli-windows-amd64.zip' }
            'ARM64' { 'duckdb_cli-windows-arm64.zip' }
            # Same allowlist discipline as the unix step: refuse, do not fall back to no CLI.
            default { throw "No duckdb CLI asset is known for Windows/$($env:RUNNER_ARCH)." }
          }
          $dest = Join-Path $env:USERPROFILE 'duckdb-cli'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'duckdb.zip'
          Invoke-WebRequest -Uri "https://github.com/duckdb/duckdb/releases/download/$env:DUCKDB_VERSION/$asset" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Remove-Item $zip
          # Name the failure here rather than three steps later as "duckdb: command not found",
          # which reads like a PATH problem and is not one.
          $exe = Join-Path $dest 'duckdb.exe'
          if (-not (Test-Path $exe)) { throw "$asset extracted but produced no duckdb.exe in $dest" }
          Add-Content -Path $env:GITHUB_PATH -Value $dest

      - name: Verify the test toolchain is present
        shell: bash
        run: |
          set -euo pipefail
          go version
          sqlite3 --version
          # A zero here is not a warning, it is a build failure a few steps later with a stack of
          # "undefined: bindings.Type" errors that say nothing about the cause. Name it now.
          test "$(go env CGO_ENABLED)" = "1" || {
            echo "CGO_ENABLED is '$(go env CGO_ENABLED)'; the DuckDB sink links DuckDB statically" >&2
            exit 1
          }
          # cgo needs a C compiler, and on Windows that is the one part of this toolchain the image
          # supplies rather than a step above. Naming its absence here beats discovering it as a
          # link error inside `go build` with no indication that the compiler was the missing piece.
          cc="$(go env CC)"
          command -v "$cc" >/dev/null 2>&1 || {
            echo "cgo needs a C compiler but '$cc' (go env CC) is not on PATH" >&2
            exit 1
          }
          # Captured, not piped. Under `set -o pipefail` a `| head -1` or `| grep -q` exits as soon
          # as it has what it wants, the writer gets SIGPIPE, and the pipeline reports 141 - a red
          # step with nothing wrong. Rare, load-dependent, and exactly the kind of flake nobody can
          # reproduce on demand.
          cc_version="$("$cc" --version)"
          printf '%s\n' "$cc_version" | sed -n 1p
          # The duckdb CLI is now INSTALLED on every runner (see the steps above) and
          # FERRODB_REQUIRE_DUCKDB_CLI=1 makes the sink tests refuse the fallback reader rather
          # than quietly using it. Both halves are asserted here, because the failure this catches
          # is the one that produces a green run: an install step that stopped working would
          # otherwise just move the tests back onto the weaker reader without saying anything.
          # Captured rather than piped into grep, for the SIGPIPE reason given above.
          duckdb_version="$(duckdb --version)"
          echo "$duckdb_version"
          case "$duckdb_version" in
            *"${DUCKDB_VERSION}"*) ;;
            *)
              echo "duckdb on PATH is '$duckdb_version', not the pinned ${DUCKDB_VERSION}." >&2
              echo "A different CLI may render values differently, which reads as a data mismatch." >&2
              exit 1 ;;
          esac
          # There is deliberately NO assertion here that FERRODB_REQUIRE_DUCKDB_CLI is 1. Reading a
          # variable this same file sets a dozen lines above proves nothing about anything - it
          # cannot fail unless someone edits both halves, and someone editing both halves meant to.
          # What actually enforces it is the test suites: they refuse to run on the fallback reader
          # when it is set, which is a check on the real behaviour rather than on a string.
          echo "toolchain OK (duckdb CLI ${DUCKDB_VERSION} present; sink tests refuse the fallback)"

      # cgo, proven per platform and attributed to its own step.
      #
      # go-duckdb links DuckDB statically, so this is where a platform without a working cgo
      # toolchain fails - loudly, by name, before `go test` and `cargo test` fail with a stack of
      # link errors that say nothing about the cause. It is also the step that makes the Windows
      # claim real rather than assumed: the DuckDB sink had only ever been built on darwin/arm64.
      - name: Build the consumer (proves cgo and go-duckdb work on this platform)
        working-directory: cdc-consumer
        run: go build ./...

      # After the toolchain checks, not before them. These tests now include a rendering comparison
      # against the real duckdb CLI, so running them earlier - as this step used to - would have
      # them refuse on a CLI that had not been installed yet.
      - name: Go tests
        working-directory: cdc-consumer
        run: go test ./...

      # Examples are spawned by several integration tests, and `cargo test` does NOT rebuild them.
      # Without this they would be stale or absent, and the freshness guards in those tests would
      # fail with an instruction nobody is there to follow.
      - run: cargo build --examples

      - run: cargo test

      # THE CHECKPOINT GATE.
      #
      # A checkpoint truncates the WAL. At the default interval of 256 commits that almost never
      # happens mid-test, and four separate features have now shipped a test that passed only
      # because of it - each one failing for real once it crossed the threshold. E17 added
      # FERRODB_CHECKPOINT_INTERVAL so the rare thing could be made constant; providing the knob
      # did not stop the class recurring, because nothing obliged anyone to turn it.
      #
      # This turns it. The list below is tests that CLAIM to hold regardless of when a checkpoint
      # lands, and the convention is: if you write a test that claims checkpoint-independence, add
      # it here. Tests NOT listed are checkpoint-dependent on purpose - an unpinned consumer races
      # the checkpointer by design, and integration_cdc_stream, integration_cdc_snapshot and
      # integration_base_backup all fail at interval=1 for that documented reason.
      - name: Checkpoint gate (every commit truncates)
        shell: bash
        run: |
          set -euo pipefail
          # integration_cdc_cutover and its concurrent companion joined this list after both were
          # found green at the default interval and broken at 1: the snapshot-to-stream handoff was
          # published without a pin, so the log was truncated out from under the resume point and
          # the consumer was refused before reading a record. Exactly the class this gate is for.
          TESTS="integration_checkpoint_pressure integration_cdc_latency integration_truncation_race integration_cdc_cutover integration_cdc_cutover_concurrent"
          # Refuse rather than silently cover nothing: a renamed or deleted test file would
          # otherwise make this step pass by running an empty list, which is the failure mode this
          # whole gate exists to prevent.
          for t in $TESTS; do
            if [ ! -f "tests/$t.rs" ]; then
              echo "checkpoint gate names tests/$t.rs, which does not exist."
              echo "If it was renamed, update this list; if it was deleted, say so here."
              exit 1
            fi
          done
          for t in $TESTS; do
            echo "::group::$t at FERRODB_CHECKPOINT_INTERVAL=1"
            FERRODB_CHECKPOINT_INTERVAL=1 cargo test --test "$t"
            echo "::endgroup::"
          done